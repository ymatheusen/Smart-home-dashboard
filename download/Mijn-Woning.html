<html lang="nl">
  <head>
    <meta charset="UTF-8" />

    <title>Mijn Woning · Welkom thuis</title>
    
    <style>
      html,
      body {
        margin: 0;
        background: #141614;
        color: #eeeee8;
      }
      .boot-screen {
        max-width: 420px;
        margin: 18vh auto;
        padding: 28px;
        font:
          16px/1.7 system-ui,
          sans-serif;
      }
      .boot-screen h1 {
        color: #d6b87a;
        font-size: 28px;
        font-weight: 500;
      }
      .boot-screen p {
        color: #aeb39f;
      }
      .boot-screen small {
        color: #858e78;
      }
      .boot-screen button {
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        background: #d6b87a;
        color: #141614;
        cursor: pointer;
      }
    </style>
