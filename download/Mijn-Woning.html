      html,
      body {
        margin: 0;
        background: #141614;

        padding: 28px;

        color: #aeb39f;
      }
      .boot-screen small {
        color: #858e78;
      }
      .boot-screen button {
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        background: #d6b87a;
        color: #141614;
        cursor: pointer;
      }
    </style>
